server {
    listen 80;
    root /usr/share/nginx/html;
    index _shell.html;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /dashboard/api/ {
        proxy_pass http://api:8000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
